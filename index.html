<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 20th Birthday My Love 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Baloo 2', cursive;
    background: linear-gradient(135deg, #ffcce6, #ffe6f7, #ffd1dc);
    text-align: center;
    overflow-x: hidden;
    transition: 1s;
}

.container {
    padding: 30px 20px;
}

h1 {
    font-family: 'Pacifico', cursive;
    font-size: 42px;
    color: #ff4da6;
}

.photo-frame {
    margin: 20px auto;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    padding: 10px;
    background: linear-gradient(45deg, #ff99cc, #ff66b2);
}

.photo-frame img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

button {
    margin-top: 20px;
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff4da6;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff1493;
}

#surprise {
    display: none;
    margin-top: 20px;
    font-size: 20px;
    color: #ff1493;
}

.heart {
    position: fixed;
    bottom: -20px;
    font-size: 24px;
    animation: rise 6s linear infinite;
}

@keyframes rise {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- Hidden YouTube Player -->
<iframe id="musicFrame"
style="display:none;"
allow="autoplay; encrypted-media">
</iframe>

<div class="container">

<h1>🎂 Happy 20th Birthday 🎂</h1>

<div class="photo-frame">
    <img src="foto-dora.jpg" alt="Foto Pacarku">
</div>

<p>
Selamat ulang tahun ke-20 sayangku 💖  
Kita usahakan rumah itu… dan semua masa depan indah di dalamnya 🤍✨
</p>

<button id="loveButton" onclick="startLove()">Klik Aku Dong 🥰</button>

<div id="surprise">
💕 Aku cinta kamu hari ini, besok, dan selamanya 💕
</div>

</div>

<script>
function startLove() {

    // PLAY LAGU
    document.getElementById("musicFrame").src =
        "https://www.youtube.com/embed/7SqNVv98e8Q?autoplay=1&loop=1&playlist=7SqNVv98e8Q";

    // TAMPILKAN PESAN
    document.getElementById("surprise").style.display = "block";

    // UBAH TOMBOL
    document.getElementById("loveButton").innerHTML = "Aku Cinta Kamu 💕";

    // UBAH BACKGROUND
    document.body.style.background =
        "linear-gradient(135deg, #ffb6d9, #ffd6f0, #ff99cc)";
}

// Floating Hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>
</html>
